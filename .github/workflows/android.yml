name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_EXERCISE_VERSION_ID: ${{ secrets.SUPABASE_EXERCISE_VERSION_ID }}
          K_MAT_SIGNING_STORE_FILE: ${{ github.workspace }}/android-app/release-key.jks
          K_MAT_SIGNING_STORE_PASSWORD: ${{ secrets.K_MAT_SIGNING_STORE_PASSWORD }}
          K_MAT_SIGNING_KEY_ALIAS: ${{ secrets.K_MAT_SIGNING_KEY_ALIAS }}
          K_MAT_SIGNING_KEY_PASSWORD: ${{ secrets.K_MAT_SIGNING_KEY_PASSWORD }}
          K_MAT_SIGNING_KEYSTORE_BASE64: ${{ secrets.K_MAT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configura SUPABASE_URL y SUPABASE_ANON_KEY en los secretos del repositorio."
            exit 1
          fi
          if [ -z "$K_MAT_SIGNING_KEYSTORE_BASE64" ] || [ -z "$K_MAT_SIGNING_STORE_PASSWORD" ] || [ -z "$K_MAT_SIGNING_KEY_ALIAS" ] || [ -z "$K_MAT_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Configura los cuatro secretos de firma K_MAT_SIGNING_* antes de generar un APK release."
            exit 1
          fi
          printf '%s' "$K_MAT_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$K_MAT_SIGNING_STORE_FILE"
          ./gradlew assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: k-mat-release-apk
          path: android-app/app/build/outputs/apk/release/k-mat-*.apk
          if-no-files-found: error
